# Evaluation configuration for audio reconstruction
name: stft-autoencoder-1s

# Model checkpoint
checkpoint: ./checkpoints/stft-vocoder-MultipleResBlocks-MRSTFT-1.0-L1-1.0/best_model.pth

# Output
output_dir: ./evaluation/reconstructions
num_samples: 10  # Number of test samples to reconstruct

# Data
data:
  chunks_dir: ./maestro-chunks-stft
  split: test
  sample_rate: 44100
  chunk_seconds: 1.0  # Must match preprocessing chunk_seconds

# STFT parameters (must match training)
stft:
  n_fft: 1024
  hop_length: 256
  win_length: 1024

