# Configuration for Latent Diffusion Model Training
# This diffusion model operates in the latent space of a pre-trained autoencoder

name: latent-diffusion

# Pre-trained autoencoder checkpoint (REQUIRED)
# The diffusion model learns to generate latents that this autoencoder can decode
autoencoder:
  checkpoint: ./checkpoints/stft-vocoder-MultipleResBlocks-MRSTFT-1.0-L1-1.0/best_model.pth
  config: ./config.yaml  # Original autoencoder config for architecture params

# Diffusion model architecture
diffusion:
  # These MUST match autoencoder's latent space
  d_model: 256           # Latent dimension (from autoencoder)
  num_segments: 25       # Number of latent tokens (from autoencoder)
  
  # Denoiser network
  n_heads: 8             # Attention heads (can differ from autoencoder)
  n_layers: 12            # Transformer layers (6-12 works well)
  dropout: 0.1           # Regularization
  
  # Noise schedule
  num_timesteps: 1000    # Diffusion steps (standard: 1000)
  schedule: cosine       # 'cosine' (recommended) or 'linear'

# Training settings
train:
  batch_size: 2048        # RTX 5090 can handle larger batches
  num_epochs: 100        # Diffusion typically needs more epochs
  learning_rate: 0.0001  # Adam LR (1e-4 is standard)
  weight_decay: 0.0001
  
  # Learning rate schedule
  warmup_steps: 1000     # Linear warmup (important for stability)
  
  # EMA (Exponential Moving Average)
  # Maintains a smoothed copy of weights for better samples
  ema_decay: 0.9999      # Higher = smoother (0.9999 is standard)
  use_ema: true
  
  # Checkpointing
  save_interval: 5       # Save every N epochs
  save_path: ./checkpoints/latent-diffusion
  
  # Data loading
  num_workers: 8         # More workers for faster loading
  prefetch_factor: 4     # Prefetch more batches
  pin_memory: true
  persistent_workers: true

# Data settings (uses same preprocessed data as autoencoder)
data:
  chunks_dir: ./maestro-chunks-stft
  split: train
  val_split: validation
  
  # Pre-compute latents for faster training (recommended)
  # If true, encode all data once and cache to disk
  cache_latents: true
  latents_cache_dir: ./maestro-chunks-latent

# Sampling settings (for evaluation during training)
sampling:
  num_samples: 4         # Samples to generate per evaluation
  sample_interval: 10    # Generate samples every N epochs
  output_dir: ./checkpoints/latent-diffusion/samples

