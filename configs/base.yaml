# Base configuration - Shared defaults for all experiments
# Override these values in experiment-specific configs

model:
  # Encoder/Decoder architecture
  num_segments: 29     # Number of time segments (= number of latent tokens); 29*2*3=174 STFT frames
  d_model: 384         # Latent dimension
  n_heads: 8           # Transformer attention heads
  n_layers: 6          # Transformer layers
  channels: [256, 128, 64, 32, 16]     # Decoder channel counts for 2D upsampling blocks
  upsampling_factors: [1, 1, 2, 3]     # Temporal upsampling factors (product=6 frames/segment)
  dropout: 0.0         # Regularization to prevent overfitting
  stft_loss_weight: 0.0  # Direct STFT prediction loss (0.0 = disabled)

stft:
  n_fft: 1024          # FFT size -> 513 frequency bins
  hop_length: 256      # Hop between frames
  win_length: 1024     # Window length (same as n_fft)

data:
  data_dir: ./maestro-v3.0.0
  chunks_dir: ./maestro-chunks-stft
  chunk_seconds: 1.0
  sample_rate: 44100
  overlap: 0.5  # 50% overlap for chunk diversity (doubles training data)
  split: train
  val_split: validation
  # MUSDB18 stem pair training (set musdb_chunks_dir to enable)
  musdb_chunks_dir: null
  use_stem_pairs: false
  use_musdb_single: false

train:
  batch_size: 32
  num_epochs: 40
  learning_rate: 0.0001
  weight_decay: 0.0001
  save_interval: 2
  save_path: ./checkpoints
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
  scheduler: cosine
  warmup_epochs: 0            # linear warmup epochs
  reset_scheduler_on_resume: true
  scheduler_warmup_epochs: 2
  gradient_accumulation_steps: 1

huggingface:
  enabled: false
  repo_id: null
  push_best: true
  push_checkpoints: false
  push_interval: 5
  private: false

tensorboard:
  enabled: true
  log_audio: true
  alpha_sweep_alphas: [0.1, 0.3, 0.5, 0.7, 0.9]
  alpha_sweep_samples: 100

