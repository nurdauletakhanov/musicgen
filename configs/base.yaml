# Shared defaults for v1+ experiments. Experiment configs override what they
# need. Historical fields (num_epochs, stem pairs, alpha_sweep, HF hub, TB)
# were archived with the pre-v1 lineage.

stft:
  n_fft: 1024
  hop_length: 256
  win_length: 1024

data:
  chunk_seconds: 1.0
  sample_rate: 44100

train:
  num_workers: 6
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
  save_path: ./checkpoints
  grad_clip: 1.0
  optimizer_betas: [0.8, 0.99]
  weight_decay: 0.001
