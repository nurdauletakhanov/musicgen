# comp-21x/v1 Phase 2: lambda_mix = 1.0
# Resume from Phase 1: --resume checkpoints/comp-21x/v1/best_model.pth

name: comp-21x/v1-phase2-mix1.0

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: true

model:
  num_segments: 108
  d_model: 96
  n_heads: 4
  n_layers: 6

  encoder_channels: [32, 64, 96, 96, 96, 96, 96, 96]
  freq_strides: [2, 2, 2, 2, 2, 2, 2, 2]
  time_strides: [1, 2, 2, 2, 1, 1, 1, 1]

  channels: [96, 96, 96, 96, 96, 64, 48, 32, 32]
  num_refine_blocks: 12

  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]

  latent_mix_weight: 0.0
  decode_mix_weight: 1.0
  latent_l2_weight: 0.001
  mix_l1_weight: 1.0
  mix_mrstft_weight: 1.0

  use_discriminator: true
  use_mpd: false
  disc_weight: 0.5
  feat_match_weight: 1.0
  disc_start_epoch: 0

train:
  batch_size: 8
  num_epochs: 400
  learning_rate: 0.00003
  disc_lr: 0.00003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 2
  gradient_accumulation_steps: 10
  save_interval: 10
  num_test_samples: 5
  disc_crop_seconds: 2.0
  mix_every_n: 5
  reset_scheduler_on_resume: true
  reset_best_loss: true
