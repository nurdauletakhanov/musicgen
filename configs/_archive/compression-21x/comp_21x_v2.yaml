# comp-21x-v2: Fixes audio quality issues from v1
#
# Key changes from v1:
#   - consistency_weight: 1.0 (penalizes invalid STFT predictions)
#   - waveform_l1_weight: 0.1 (direct time-domain supervision)
#   - Cyclic refinement dilations (decoder.py change — no more 177K dilation)
#   - disc_start_epoch: 25 (was 15 — more recon warmup)
#   - batch_size: 10 (was 8), grad_accum: 8 (was 10) → effective ~80
#
# Run:
#   python -m training.train --config configs/experiments/compression-21x/comp_21x_v2.yaml

name: comp-21x/v2

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: false

model:
  num_segments: 108
  d_model: 96
  n_heads: 4
  n_layers: 6

  encoder_channels: [32, 64, 96, 96, 96, 96, 96, 96]
  freq_strides: [2, 2, 2, 2, 2, 2, 2, 2]
  time_strides: [1, 2, 2, 2, 1, 1, 1, 1]

  channels: [96, 96, 96, 96, 96, 64, 48, 32, 32]
  num_refine_blocks: 12

  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]

  consistency_weight: 1.0
  waveform_l1_weight: 0.1

  latent_mix_weight: 0.0
  decode_mix_weight: 0.0
  latent_l2_weight: 0.001

  use_discriminator: true
  use_mpd: false
  disc_weight: 0.5
  feat_match_weight: 1.0
  disc_start_epoch: 25

train:
  batch_size: 8
  num_epochs: 300
  learning_rate: 0.0003
  disc_lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 12
  save_interval: 10
  num_test_samples: 5
  disc_crop_seconds: 2.0
