# Phase 1: Reconstruction with ~48x compression
# 5-second chunks, ~10 tokens/sec, d_model=96
# Latent: 48 tokens × 96 dims = 4,608 floats (vs 220,500 waveform samples)
# Decoder: 48 × 18 = 864 output frames (≈862 needed for 5s)
#
# Run:
#   python -m training.train --config configs/experiments/compression/comp_46x_phase1.yaml

name: comp-46x

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_musdb_single: true
  use_stem_pairs: false

model:
  num_segments: 48
  d_model: 96
  n_heads: 8
  n_layers: 6
  channels: [256, 128, 64, 32, 16]
  mrstft_weight: 1.0
  latent_mix_weight: 0.0
  decode_mix_weight: 0.0

train:
  batch_size: 24
  num_epochs: 200
  learning_rate: 0.0003
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 4  # effective batch 24 * 4 = 96
