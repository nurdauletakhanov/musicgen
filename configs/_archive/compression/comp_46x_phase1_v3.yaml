name: comp-46x-v3

# Changes from v2:
#   - Log-mel spectrogram loss (mel_weight=1.0) for perceptual frequency weighting
#   - Multi-Period Discriminator (MPD, periods 2/3/5/7/11) alongside MSSTFTD
#   - MR-STFT FFT floor raised from 64 → 256 (removes 2 uninformative low-res scales)
#   - Training from scratch

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: false

model:
  num_segments: 48
  d_model: 96
  n_heads: 8
  n_layers: 6
  channels: [512, 256, 128, 64, 32]
  num_refine_blocks: 3
  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]
  latent_mix_weight: 0.0
  decode_mix_weight: 0.0
  use_discriminator: true
  disc_weight: 1.0
  feat_match_weight: 2.0
  disc_start_epoch: 5

train:
  batch_size: 12
  num_epochs: 300
  learning_rate: 0.0003
  disc_lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 8
  save_interval: 10
  num_test_samples: 5
  disc_crop_seconds: 1.0
