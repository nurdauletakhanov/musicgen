name: comp-46x-v4

# v4 redesign — pure strided 2D CNN encoder/decoder:
#   - Encoder: 4× stride-2 ConvBlock2D + learned freq-collapse Conv2D
#             No pooling, no segmentation, no arbitrary temporal destruction
#   - Decoder: full-map Upsample2DBlocks from [B, 96, 1, 48] — no per-token stitching
#   - Loss:    MR-STFT + Mel only (waveform L1 dropped)
#   - disc_start_epoch: 10 (longer warmup without L1 to anchor early training)
#   - num_refine_blocks: 6 (dilated RF covers full 5s clip)

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: false

model:
  num_segments: 48
  d_model: 96
  n_heads: 4
  n_layers: 6
  encoder_channels: [32, 64, 128, 256]
  channels: [384, 256, 128, 64, 32]
  num_refine_blocks: 6
  mrstft_weight: 1.0
  mel_weight: 1.0
  phase_weight: 0.5
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]
  latent_mix_weight: 0.0
  decode_mix_weight: 0.0
  use_discriminator: true
  disc_weight: 1.0
  feat_match_weight: 2.0
  disc_start_epoch: 10

train:
  batch_size: 8
  num_epochs: 300
  learning_rate: 0.0003
  disc_lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 12
  save_interval: 10
  num_test_samples: 5
  disc_crop_seconds: 1.0