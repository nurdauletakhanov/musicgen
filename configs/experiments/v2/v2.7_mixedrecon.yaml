name: v2.7-mixedrecon

# v2.7 — ATTRIBUTION CONTROL for the decode-mixing arm.
#
# v2.1 changes three things at once against the baseline: supervision flows
# through an interpolated latent, the target is a mixed waveform, and the
# mixed path carries a waveform L1 term the reconstruction path lacks. This
# run holds the last two and removes the first: identical three-term loss on
# the identical mixed target, but applied to g(f(x_mix)) rather than to the
# decode of an interpolated latent. If it reproduces v2.1's ground-truth
# mixing gain, interpolated-latent supervision is not what produces it.
# Tests whether the paper's main claim (decode-mix improves linearity AND
# reconstruction) holds on a much stronger baseline than the paper's testbed.

data:
  chunks_dir: ./chunks-44k-1s
  sample_rate: 44100
  chunk_seconds: 1.0
  use_stem_pairs: false

stft:
  n_fft: 1024
  hop_length: 256
  win_length: 1024

model:
  architecture: wave
  num_segments: 45
  d_model: 128
  n_heads: 4
  n_layers: 0
  encoder_strides: [4, 5, 7, 7]
  encoder_channels: [64, 128, 256, 512, 512]
  encoder_dilations: [1, 3, 9]
  encoder_kernel_scale: 2
  decoder_channels: [512, 512, 256, 128, 64]
  decoder_resblock_kernel_sizes: [3, 7]
  decoder_resblock_dilations: [[1, 3], [1, 3]]
  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048]
  mrstft_hops: [64, 128, 256, 512]
  mrstft_wins: [256, 512, 1024, 2048]
  decode_mix_weight: 0.0     # <-- v2.7: no interpolated-latent supervision
  latent_mix_weight: 0.0
  mixed_recon_weight: 0.5    # <-- v2.7: same mixed target and waveform L1,
                             #     but through g(f(x_mix)), not g(z_interp)
  disc_on_mix: false
  latent_l2_weight: 0.001
  use_discriminator: true
  use_mpd: true
  disc_weight: 0.5
  feat_match_weight: 2.0
  disc_start_step: 0
  dropout: 0.0

train:
  precision: fp32
  schedule_mode: steps
  max_steps: 25000
  warmup_steps: 500
  save_every_steps: 5000
  log_every_steps: 100
  batch_size: 32
  grad_accum_steps: 2
  learning_rate: 0.0001
  disc_lr: 0.00005
  weight_decay: 0.001
  optimizer_betas: [0.8, 0.99]
  grad_clip: 1.0
  num_test_samples: 4
  num_val_batches: null
  log_val_audio: true
  freeze_encoder: false
  save_path: ./checkpoints
