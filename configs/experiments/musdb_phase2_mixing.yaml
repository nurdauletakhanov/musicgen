# Phase 2: Mixing equivariance on MUSDB18 stem pairs
# Resume from Phase 1 checkpoint — adds decode mixing loss to test linearity.
# Uses individual stems for reconstruction + stem pairs for mixing loss.
#
# Run:
#   python -m training.train --config configs/experiments/musdb_phase2_mixing.yaml \
#       --resume checkpoints/musdb-phase1-recon/best_model.pth

name: musdb-phase2-mixing

data:
  musdb_chunks_dir: ./musdb-chunks-stft
  use_musdb_single: true
  use_stem_pairs: true

train:
  batch_size: 16
  num_epochs: 120  # 80 (Phase 1) + 40 (Phase 2)
  reset_scheduler_on_resume: true
  scheduler_warmup_epochs: 2
  reset_best_loss: true

model:
  l1_weight: 1.0
  mrstft_weight: 1.0
  mix_l1_weight: 1.0
  mix_mrstft_weight: 1.0
  latent_mix_weight: 0.0
  decode_mix_weight: 0.01
