# Phase 2: Mixing equivariance on MUSDB18 with full 2D decoder
# Resume from Phase 1 2D checkpoint — adds decode mixing loss to enforce linearity.
# Uses individual stems for reconstruction + stem pairs for mixing loss.
# Data: musdb-chunks-stft-v2 (center=True padding)
#
# Run:
#   python -m training.train --config configs/experiments/musdb_phase2_2d.yaml \
#       --resume checkpoints/musdb-phase1-2d/best_model.pth

name: musdb-phase2-2d

data:
  musdb_chunks_dir: ./musdb-chunks-stft-v2
  use_musdb_single: true
  use_stem_pairs: true

train:
  batch_size: 48
  num_epochs: 300  # 200 (Phase 1) + 100 (Phase 2)
  learning_rate: 0.00003
  scheduler: cosine
  warmup_epochs: 2
  reset_scheduler_on_resume: true
  reset_best_loss: true
  gradient_accumulation_steps: 1
  mix_every_n: 5

model:
  stft_loss_weight: 1.0
  l1_weight: 1.0
  mrstft_weight: 1.0
  mix_l1_weight: 1.0
  mix_mrstft_weight: 1.0
  latent_mix_weight: 0.0
  decode_mix_weight: 0.01
