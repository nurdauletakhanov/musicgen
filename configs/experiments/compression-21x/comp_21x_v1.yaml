# comp-21x-v1: 8-block stride-2 encoder/decoder for gentler compression
#
# Key changes from comp-24x-v6:
#   1. 8 conv blocks (was 5), all stride-2 in freq (was stride-3)
#      → 513→257→129→65→33→17→9→5→3 (halving, not thirding)
#   2. Stride-2 in time where needed: [1,2,2,2,1,1,1,1] (was [1,3,3,1,1])
#      → 864→864→432→216→108 (gentler than 864→288→96)
#   3. Narrow early / wide late channels: [32,64,96,96,96,96,96,96]
#   4. 12 refinement blocks (was 6), checkpointed — no extra VRAM
#   5. STFT-only discriminator (no MPD) — fixes 44M vs 2.5M imbalance
#   6. Latent: [108, 96] → ~21x waveform compression (was [96,96] / 24x)
#
# Run:
#   python -m training.train --config configs/experiments/compression-21x/comp_21x_v1.yaml

name: comp-21x/v1

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: false

model:
  num_segments: 108
  d_model: 96
  n_heads: 4
  n_layers: 6

  encoder_channels: [32, 64, 96, 96, 96, 96, 96, 96]
  freq_strides: [2, 2, 2, 2, 2, 2, 2, 2]
  time_strides: [1, 2, 2, 2, 1, 1, 1, 1]

  channels: [96, 96, 96, 96, 96, 64, 48, 32, 32]
  num_refine_blocks: 12

  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]

  latent_mix_weight: 0.0
  decode_mix_weight: 0.0
  latent_l2_weight: 0.001

  use_discriminator: true
  use_mpd: false
  disc_weight: 0.5
  feat_match_weight: 1.0
  disc_start_epoch: 15

train:
  batch_size: 8
  num_epochs: 300
  learning_rate: 0.0003
  disc_lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 10
  save_interval: 10
  num_test_samples: 5
  disc_crop_seconds: 2.0
