# Phase 1: Pure reconstruction on MUSDB18 with full 2D decoder
# Uses 29 latent tokens, 6 frames/segment → 174 STFT frames (center=True)
# Data must be preprocessed with center=True padding (musdb-chunks-stft-v2)
#
# Run:
#   python -m training.train --config configs/experiments/musdb_phase1_2d.yaml

name: musdb-phase1-2d

data:
  musdb_chunks_dir: ./musdb-chunks-stft-v2
  use_musdb_single: true
  use_stem_pairs: false

train:
  batch_size: 128
  num_epochs: 200
  learning_rate: 0.0003
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 2

model:
  stft_loss_weight: 1.0
  l1_weight: 1.0
  mrstft_weight: 1.0
  latent_mix_weight: 0.0
  decode_mix_weight: 0.0
