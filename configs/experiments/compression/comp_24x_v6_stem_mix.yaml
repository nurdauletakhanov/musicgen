name: comp-24x-v6-stem-mix

# v6 + stem-pair mixing (Option β) from scratch, 300 epochs.
# Identical to comp_24x_v6.yaml except:
#   - use_stem_pairs: true (StemPairDataset, same-track aligned stems)
#   - stem_mix_weight: 1.0 (spectral + wav L1 on interpolated stem pairs)
#
# Control comparison: comp-24x-v6 phase-1 (GAN only) → 84.2° phase, -24.4 dB SI-SDR
# Hypothesis: stem-pair mixing + GAN from scratch should beat phase-1 on phase error.

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: true

model:
  num_segments: 96
  d_model: 96
  n_heads: 4
  n_layers: 6

  encoder_channels: [48, 96, 96, 96, 96]
  freq_strides: [3, 3, 3, 3, 3]
  time_strides: [1, 3, 3, 1, 1]

  channels: [96, 96, 64, 48, 32, 32]
  num_refine_blocks: 6

  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]

  decode_mix_weight: 0.0
  stem_mix_weight: 1.0
  latent_l2_weight: 0.001

  use_discriminator: true
  disc_weight: 0.5
  feat_match_weight: 1.0
  disc_start_epoch: 25

train:
  batch_size: 12
  num_epochs: 300
  learning_rate: 0.0003
  disc_lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 8
  save_interval: 10
  num_test_samples: 5
  disc_crop_seconds: 1.0
