name: comp-24x-v6-nogan-mix1.0

# Experiment 2a: v6 STFT architecture, NO GAN, WITH mixing, from scratch.
#
# Hypothesis: the decode-mixing loss alone (Option α, random cross-batch pairs)
# can supervise phase coherence and reach v6 phase-2 quality WITHOUT a
# discriminator. If this works it's a much stronger scientific claim for the
# ISMIR paper (mixing as an implicit phase anchor, no adversarial hacks).
#
# Architecture: identical to comp-24x-v6 phase 1 (encoder + decoder unchanged).
# Loss: mel L1 + MR-STFT (log-mag + SC) + decode_mix L1 (lambda=1.0) + latent L2.
# Mixing: Option alpha only — random cross-batch permutation inside
#         Autoencoder.forward (the trainer stem-pair path no longer exists).

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: false

model:
  num_segments: 96
  d_model: 96
  n_heads: 4
  n_layers: 6

  # Encoder (unchanged from v6 phase 1)
  encoder_channels: [48, 96, 96, 96, 96]
  freq_strides: [3, 3, 3, 3, 3]
  time_strides: [1, 3, 3, 1, 1]

  # Decoder (unchanged from v6 phase 1)
  channels: [96, 96, 64, 48, 32, 32]
  num_refine_blocks: 6

  # Reconstruction losses
  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]

  # Option alpha mixing ON from step 0 (no warmup)
  decode_mix_weight: 1.0
  latent_l2_weight: 0.001

  # GAN OFF — the point of this experiment
  use_discriminator: false

train:
  batch_size: 12
  num_epochs: 500        # longer than v6 (300) since we lose the GAN shortcut
  learning_rate: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 8
  save_interval: 10
  num_test_samples: 5
