name: comp-22k-v11

# v11: per-token MLP STFT decoder + iSTFT.
#
# Why v11 exists: v6→v10 all stalled because their decoders applied smooth
# spatial mixing (conv stacks, bilinear, ConvTranspose) at full STFT/sample
# resolution. Smoothing averages neighboring frames, which destroys the
# rapidly-rotating phase at high STFT bins. The diagnostic in
# diag_encoder_phase.py confirmed:
#   - linear/MLP decoder + bilinear upsample plateaus at Phase 74°
#   - per-token direct expansion (no spatial mixing) reaches Phase <10° and
#     SI-SDR > +14 dB on overfit-one-batch with the SAME v10 encoder
#
# v11 fix: replace the decoder with a per-token MLP that maps each latent
# token independently (shared weights, no spatial mixing) into its own block
# of `frames_per_token = total_time_stride = 9` STFT frames. The resulting
# [B, 2, F, 261] STFT is iSTFT'd to a waveform; iSTFT's overlap-add provides
# the only smoothing between adjacent token blocks.
#
# Loss recipe (recon-only, minimal):
#   total = 1.0 * complex_l1(stft_pred, stft_target)
#         + 1.0 * wave_l1(istft(stft_pred), waveform_target)
#         + 0.001 * latent_l2
#
# - complex L1 fits both magnitude and phase directly (the loss the diagnostic
#   won on)
# - wave L1 disambiguates token-boundary discontinuities through iSTFT
#   overlap-add
# - latent L2 keeps latents bounded (continuous, no RVQ)
#
# Discriminator OFF in phase 1. The diagnostic shows recon-only converges
# cleanly with this architecture — adversarial signal is not needed for phase.
# A discriminator can be added in phase 2 as a polish step for high-frequency
# naturalness, not for phase fidelity.

data:
  chunk_seconds: 3.0
  sample_rate: 22050
  chunks_dir: ./musdb-chunks-22k-3s
  use_stem_pairs: false

stft:
  n_fft: 1024
  hop_length: 256
  win_length: 1024

model:
  num_segments: 29
  d_model: 96
  n_heads: 4
  n_layers: 6

  # Encoder: identical to v7/v8/v9/v10 (proven adequate at 24× compression)
  encoder_channels: [48, 96, 96, 96, 96]
  freq_strides: [3, 3, 3, 3, 3]
  time_strides: [1, 3, 3, 1, 1]   # product = 9 = frames_per_token

  # Per-token MLP decoder
  # 96 -> 2048 -> 9*2*513 = 9234, applied independently per token
  # ~19M params total
  decoder_hidden_dim: 2048

  # v11 recon recipe
  complex_l1_weight: 1.0
  wave_l1_weight: 1.0
  mel_l1_weight: 1.0
  latent_l2_weight: 0.001

  # Mixing OFF (phase 2 — only after v11 phase 1 reaches usable reconstruction)
  latent_mix_weight: 0.0
  decode_mix_weight: 0.0

  # Discriminator OFF in phase 1
  use_discriminator: false
  disc_start_epoch: 0

train:
  batch_size: 192
  num_epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 2
  save_interval: 10
  num_test_samples: 5
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 6
