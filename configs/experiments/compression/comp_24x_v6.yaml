name: comp-24x-v6

# v6: same architecture as v5, rebalanced training:
#   - Disc weights halved (disc_weight 1.0→0.5, feat_match 2.0→1.0)
#   - Disc start delayed (10→30 epochs) — let recon converge first
#   - Latent L2 regularization (0.001) — prevent unbounded latent growth

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_stem_pairs: false

model:
  num_segments: 96
  d_model: 96
  n_heads: 4
  n_layers: 6

  # Encoder: 5 blocks with stride-3 freq, channels flat at 96 after block 1
  encoder_channels: [48, 96, 96, 96, 96]
  freq_strides: [3, 3, 3, 3, 3]
  time_strides: [1, 3, 3, 1, 1]

  # Decoder: 6 stages (= 5 encoder blocks + 1 final full-res stage)
  channels: [96, 96, 64, 48, 32, 32]
  num_refine_blocks: 6

  mrstft_weight: 1.0
  mel_weight: 1.0
  mrstft_ffts: [256, 512, 1024, 2048, 4096]
  mrstft_hops: [64,  128,  256,  512, 1024]
  mrstft_wins: [256, 512, 1024, 2048, 4096]

  latent_mix_weight: 0.0
  decode_mix_weight: 0.0
  latent_l2_weight: 0.001

  use_discriminator: true
  disc_weight: 0.5
  feat_match_weight: 1.0
  disc_start_epoch: 25

train:
  batch_size: 12
  num_epochs: 300
  learning_rate: 0.0003
  disc_lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 8
  save_interval: 10
  num_test_samples: 5
  disc_crop_seconds: 1.0
