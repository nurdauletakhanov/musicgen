# Phase 1 v2: Improved reconstruction for ~48x compression
# Changes from v1:
#   - Decoder channels: [256,128,64,32,16] -> [512,256,128,64,32] (~4x capacity)
#   - 3 dilated refinement blocks (powers of 3: dilation 1,3,9) for segment blending
#   - 7 MR-STFT resolutions (was 3) covering 64-4096 FFT sizes
#   - Multi-scale STFT discriminator (starts at epoch 5)
#   - Removed direct STFT loss entirely
#
# Run:
#   python -m training.train --config configs/experiments/compression/comp_46x_phase1_v2.yaml

name: comp-46x-v2

data:
  chunk_seconds: 5.0
  chunks_dir: ./musdb-chunks-stft-5s
  use_musdb_single: true
  use_stem_pairs: false

model:
  num_segments: 48
  d_model: 96
  n_heads: 8
  n_layers: 6
  channels: [512, 256, 128, 64, 32]
  num_refine_blocks: 3
  mrstft_weight: 1.0
  mrstft_ffts: [64, 128, 256, 512, 1024, 2048, 4096]
  mrstft_hops: [16, 32, 64, 128, 256, 512, 1024]
  mrstft_wins: [64, 128, 256, 512, 1024, 2048, 4096]
  latent_mix_weight: 0.0
  decode_mix_weight: 0.0

  # Discriminator
  use_discriminator: true
  disc_weight: 1.0
  feat_match_weight: 2.0
  disc_start_epoch: 5

train:
  batch_size: 12
  num_epochs: 300
  learning_rate: 0.0003
  disc_lr: 0.0002
  scheduler: cosine
  warmup_epochs: 5
  gradient_accumulation_steps: 8  # effective batch 8 * 12 = 96
