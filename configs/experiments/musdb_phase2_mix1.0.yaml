# Phase 2 ablation: decode_mix_weight = 1.0
# Resume from Phase 1 checkpoint — tests equal-weight mixing constraint.
#
# Run:
#   python -m training.train --config configs/experiments/musdb_phase2_mix1.0.yaml \
#       --resume checkpoints/musdb-phase1-recon/best_model.pth

name: musdb-phase2-mix1.0

data:
  musdb_chunks_dir: ./musdb-chunks-stft
  use_musdb_single: true
  use_stem_pairs: true

train:
  batch_size: 16
  num_epochs: 200  # 160 (Phase 1) + 40 (Phase 2)
  scheduler: cosine
  warmup_epochs: 2
  reset_scheduler_on_resume: true
  reset_best_loss: true

model:
  l1_weight: 1.0
  mrstft_weight: 1.0
  mix_l1_weight: 1.0
  mix_mrstft_weight: 1.0
  latent_mix_weight: 0.0
  decode_mix_weight: 1.0
