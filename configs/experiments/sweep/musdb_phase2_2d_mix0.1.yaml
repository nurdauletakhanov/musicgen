# Phase 2 sweep: λ_mix = 0.1
# Run:
#   python -m training.train --config configs/experiments/sweep/musdb_phase2_2d_mix0.1.yaml \
#       --resume checkpoints/musdb-phase1-2d/best_model.pth

name: musdb-phase2-2d-mix0.1

data:
  musdb_chunks_dir: ./musdb-chunks-stft-v2
  use_musdb_single: true
  use_stem_pairs: true

train:
  batch_size: 48
  num_epochs: 220  # 200 (Phase 1) + 20 (sweep)
  learning_rate: 0.00003
  scheduler: cosine
  warmup_epochs: 2
  reset_scheduler_on_resume: true
  reset_best_loss: true
  gradient_accumulation_steps: 1
  mix_every_n: 5

model:
  stft_loss_weight: 1.0
  l1_weight: 1.0
  mrstft_weight: 1.0
  mix_l1_weight: 1.0
  mix_mrstft_weight: 1.0
  latent_mix_weight: 0.0
  decode_mix_weight: 0.1
